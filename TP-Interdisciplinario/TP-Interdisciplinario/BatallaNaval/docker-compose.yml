services:
  servidor:
    build: .
    image: batalla-naval-servidor
    container_name: batalla-naval-servidor
    ports:
      - "5000:5000"
    environment:
      - PUERTO=5000
      - HISTORIAL=/app/data/historial_partidas.txt
    volumes:
      - ./data:/app/data        # el historial de partidas queda en la PC
    stdin_open: true            # permite usar la consola del servidor (docker attach)
    tty: true
    restart: unless-stopped
